<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#157f5a">
    <title>Hors ligne — NGAKODON</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(120% 120% at 50% 0%, #0f6647 0%, #073527 100%); color: #fff; text-align: center; }
        .off { max-width: 380px; }
        .off img { width: 110px; height: 110px; border-radius: 26px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.5); margin-bottom: 22px; }
        .off h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
        .off p { color: rgba(255,255,255,.82); line-height: 1.6; font-size: 1rem; margin-bottom: 24px; }
        .off button { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #0f6647; border: 0;
            font-weight: 700; font-size: 1rem; padding: 13px 28px; border-radius: 999px; cursor: pointer; box-shadow: 0 8px 22px -8px rgba(0,0,0,.4); }
        .off button:active { transform: translateY(1px); }
        .off small { display: block; margin-top: 22px; color: rgba(255,255,255,.55); font-size: .82rem; }
    </style>
</head>
<body>
    <div class="off">
        <img src="./assets/icons/nk-192.png" alt="NGAKODON">
        <h1>Vous êtes hors ligne</h1>
        <p>Impossible de joindre NGAKODON pour le moment. Vérifiez votre connexion internet, puis réessayez.</p>
        <button type="button" onclick="location.reload()">↻ Réessayer</button>
        <small>NGAKODON — Vitrine des projets GI</small>
    </div>
</body>
</html>
